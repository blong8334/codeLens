name: CodeLens review
description: Post an impact review on pull requests — risk, reading order, broken contracts, reach and external effects — with the map attached.
author: Brian Long
branding:
  icon: eye
  color: orange

inputs:
  provider:
    description: Who writes the analysis — heuristic (offline, no key), claude (Anthropic API), or openai (any OpenAI-compatible API).
    default: heuristic
  model:
    description: Model id for the claude or openai provider.
    default: ''
  anthropic-api-key:
    description: For provider claude.
    default: ''
  openai-api-key:
    description: For provider openai.
    default: ''
  openai-base-url:
    description: For provider openai — an OpenAI-compatible endpoint (default OpenAI).
    default: ''
  base:
    description: Branch to compare against. Default — the pull request's base branch.
    default: ''
  fail-on:
    description: Fail the check when overall risk is at least this level — low, medium or high. Empty never fails.
    default: ''
  comment:
    description: Post (and keep updating) a pull request comment.
    default: 'true'
  descriptions:
    description: Also write what/why descriptions for the map (cached across runs).
    default: 'true'
  include-source:
    description: Include source code in the uploaded map artifact.
    default: 'true'
  github-token:
    description: Token used to comment.
    default: ${{ github.token }}

outputs:
  risk:
    description: Overall risk level — low, medium or high.
    value: ${{ steps.review.outputs.risk }}
  report:
    description: Path to the Markdown report.
    value: ${{ runner.temp }}/codelens/review.md

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install CodeLens
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund --loglevel=error

    # Descriptions and parses are keyed by content: a rolling cache means each function is
    # analyzed once, not once per pull request.
    - uses: actions/cache@v4
      with:
        path: ~/.cache/codelens
        key: codelens-store-${{ github.repository }}-${{ github.run_id }}
        restore-keys: codelens-store-${{ github.repository }}-

    - name: Review
      id: review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
        BASE: ${{ inputs.base || github.base_ref }}
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        DESCRIPTIONS: ${{ inputs.descriptions }}
        INCLUDE_SOURCE: ${{ inputs.include-source }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/codelens"
        mkdir -p "$out"
        if [ -z "$BASE" ]; then echo "::error::No base branch: run on pull_request events or set the 'base' input"; exit 1; fi
        # The base must be fetched for the fork point (use actions/checkout with fetch-depth: 0).
        git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "origin/$BASE" >/dev/null || git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
        args=(review "$GITHUB_WORKSPACE" --base "origin/$BASE" --head HEAD -p "$PROVIDER" -o "$out/review.md" --json-out "$out/review.json" -g "$out/codelens.graph.json")
        if [ -n "$MODEL" ]; then args+=(-m "$MODEL"); fi
        if [ "$DESCRIPTIONS" != "true" ]; then args+=(--no-purpose); fi
        if [ "$INCLUDE_SOURCE" != "true" ]; then args+=(--no-source); fi
        node "$GITHUB_ACTION_PATH/packages/cli/bin/codelens.js" "${args[@]}"
        echo "risk=$(node -e 'console.log(require(process.argv[1]).risk.level)' "$out/review.json")" >> "$GITHUB_OUTPUT"
        cat "$out/review.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the map
      uses: actions/upload-artifact@v4
      with:
        name: codelens-map
        path: ${{ runner.temp }}/codelens/codelens.graph.json
        if-no-files-found: ignore

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        body="$RUNNER_TEMP/codelens/comment.md"
        # Point the footer at this run's map artifact instead of a local path.
        sed "s#<sub>Generated by CodeLens.*#<sub>Generated by CodeLens · [map](${RUN_URL}) (download \`codelens-map\`, then \`codelens view codelens.graph.json\`)</sub>#" "$RUNNER_TEMP/codelens/review.md" > "$body"
        # One comment per pull request, updated on every push.
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- codelens-review -->")) | .id' | head -n1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" >/dev/null
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$body" >/dev/null
        fi

    - name: Apply the risk threshold
      if: inputs.fail-on != ''
      shell: bash
      env:
        RISK: ${{ steps.review.outputs.risk }}
        LIMIT: ${{ inputs.fail-on }}
      run: |
        rank() { case "$1" in low) echo 0;; medium) echo 1;; high) echo 2;; *) echo "::error::fail-on must be low, medium or high" >&2; exit 2;; esac; }
        if [ "$(rank "$RISK")" -ge "$(rank "$LIMIT")" ]; then
          echo "::error::CodeLens risk is $RISK (threshold: $LIMIT)"
          exit 1
        fi
